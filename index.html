<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta charset="UTF-8">
    <title>Andrei Ardelean</title>
    <meta name="description"
        content="Andrei Ardelean — Senior software engineer and generalist with 7+ years of professional experience. Fullstack applications, data workflows, cloud systems and AI integrations.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            50.1%,
            100% {
                opacity: 0;
            }
        }

        body,
        html {
            height: 100%;
            margin: 0;
            font-family: 'Raleway', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(190, 190, 190);
        }

        .container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 100%;
            height: auto;
            flex-wrap: wrap;
        }

        .section {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            margin: 10px;
            padding: 18px;
            min-width: 380px;
            min-height: 380px;
            width: 270px;
            height: 270px;
            background: rgb(218, 218, 218);
            border-radius: 0px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: rgb(86, 86, 86);
            position: relative;
        }

        #about.section {
            background: #0a58ca;
            justify-content: space-between;
        }

        .artifact {
            display: flex;
            width: 3px;
            height: 40px;
            background-color: rgb(255, 255, 255);
            animation: blink 1.08s infinite;
        }

        .description {
            color: white;
        }

        .section-two {
            align-content: end;
            background-color: white
        }

        /* language switch */
        .lang-switch {
            position: fixed;
            top: 10px;
            right: 12px;
            font-size: 12px;
            opacity: .65;
            transition: opacity .2s ease;
            z-index: 10;
        }

        .lang-switch:hover {
            opacity: 1;
        }

        .lang-switch button {
            background: transparent;
            border: 0;
            padding: 0 4px;
            cursor: pointer;
        }

        .lang-switch .active {
            text-decoration: underline;
        }

        .badge-skill {
            display: inline-block;
            background: white;
            color: rgb(86, 86, 86);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 0px;
            margin: 6px 6px 0 0;
            white-space: nowrap;
        }

        #skills {
            padding-left: 22px;
            overflow-x: hidden;
            overflow-y: hidden;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
        }

        .skills-container {
            max-height: 91%;
            display: flex;
            flex-wrap: wrap;
            overflow-y: hidden;
        }

        .contact-link { color: inherit; text-decoration: none; }
        .skills-heading { display: none; }
        .lang-switch button:focus-visible,
        .contact-link:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }

        /* Stack before the two 380px cards run out of space. */
        @media (max-width: 850px) {
            html, body {
                display: block;
                height: auto;
                min-height: 100vh;
                min-height: 100svh;
                background-color: #0a58ca;
            }

            body { overflow-y: auto; }

            #app {
                width: 100%;
                max-width: 620px;
                margin: 0 auto;
                padding: max(12px, env(safe-area-inset-top))
                         max(16px, env(safe-area-inset-right))
                         max(24px, env(safe-area-inset-bottom))
                         max(16px, env(safe-area-inset-left));
            }

            .lang-switch {
                position: static;
                display: flex;
                justify-content: flex-end;
                align-items: center;
                min-height: 44px;
                margin-bottom: 12px;
                font-size: 13px;
                color: white;
                opacity: 1;
            }

            .lang-switch button {
                min-width: 44px;
                min-height: 44px;
                color: inherit;
            }

            .container {
                flex-direction: column;
                gap: 16px;
                width: 100%;
                padding: 0;
                margin: 0;
            }

            .section {
                width: 100%;
                min-width: 0;
                max-width: 100%;
                height: auto;
                min-height: 0;
                margin: 0;
                padding: clamp(20px, 5vw, 32px);
                font-size: 14px;
                line-height: 1.6;
            }

            #about.section {
                min-height: 0;
                height: auto;
                justify-content: flex-start;
                padding: 20px clamp(20px, 5vw, 32px) 24px;
                gap: 24px;
            }

            .artifact { height: 24px; margin-top: 0; flex-shrink: 0; }
            .description { min-width: 0; line-height: 1.7; overflow-wrap: anywhere; }
            .description.mt-4 { margin-top: 0 !important; }
            .description > span:first-child { font-size: 18px; line-height: 1.4; }
            .description > span + span { margin-top: 6px; }
            .description > span:nth-child(3) { margin-top: 12px; font-size: 15px; font-weight: 400; line-height: 1.65; }
            .contact { display: block; }
            .contact-link { display: inline-flex; align-items: center; min-height: 44px; }

            #skills.section {
                background: transparent;
                color: white;
                padding: 0 clamp(20px, 5vw, 32px) 24px;
                overflow: visible;
            }

            .skills-heading {
                display: block;
                width: 100%;
                margin: 0 0 16px;
                padding-top: 24px;
                border-top: 1px solid rgba(255, 255, 255, .24);
                font-size: 12px;
                font-weight: 600;
                line-height: 1.5;
                letter-spacing: .1em;
                text-transform: uppercase;
                color: white;
            }

            .skills-container {
                display: flex;
                width: 100%;
                min-width: 0;
                max-height: none;
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 8px;
                overflow: visible;
            }

            .badge-skill {
                background: rgba(255, 255, 255, .06);
                border: 1px solid rgba(255, 255, 255, .28);
                color: white;
                max-width: 100%;
                margin: 0;
                padding: 6px 9px;
                font-size: 12px;
                font-weight: 400;
                line-height: 1.5;
                white-space: normal;
                overflow-wrap: anywhere;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .artifact { animation: none; }
        }
    </style>
</head>

<body>
    <div id="app" :lang="lang">
        <div class="lang-switch">
            <button type="button" aria-label="Read in English" :aria-pressed="lang === 'en'" :class="{ active: lang === 'en' }" @click="setLang('en')">EN</button> |
            <button type="button" aria-label="Citește în română" :aria-pressed="lang === 'ro'" :class="{ active: lang === 'ro' }" @click="setLang('ro')">RO</button>
        </div>
        <div class="container">
            <!-- About -->
            <div id="about" class="section d-flex flex-column">
                <div class="artifact d-flex"></div>
                <v-card flat class="transparent d-flex">
                    <div class="d-flex flex-column mt-4 description" style="text-align: left">
                        <span>Ardelean Andrei P.F.A.<br></span>
                        <span>{{ t('svc') }}<br></span>
                        <span>{{ t('spec') }}</span>
                        <span class="contact mt-3">{{ t('contact') }}: <a class="contact-link" href="mailto:andrei@ardy.ro">andrei@ardy.ro</a></span>
                    </div>
                </v-card>
            </div>
            <!-- Skills -->
            <div id="skills" class="section d-flex">
                <h2 class="skills-heading">{{ lang === 'ro' ? 'Competențe' : 'Skills' }}</h2>
                <v-card flat class="transparent skills-container">
                    <span v-for="skill in t('skills')" :key="skill" class="badge-skill">{{ skill }}</span>
                </v-card>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: () => ({
                lang: 'en',
                messages: {
                    en: {
                        svc: 'Software Development & Consulting',
                        spec: 'Senior software engineer and generalist with 7+ years of professional experience. I build fullstack applications, data workflows, cloud systems and AI integrations.',
                        contact: 'Contact',
                        skills: [
                            'JavaScript', 'TypeScript', 'Vue.js', 'Nuxt.js', 'SQL', 'Angular', 'Vuetify',
                            'Node.js', 'PostgreSQL', 'Git', 'MongoDB', 'MySQL',
                            'OpenAI API', 'Azure AI Foundry', 'Azure Document Intelligence', 'Mistral OCR', 'RxJS',
                            'LangChain', 'LangGraph', 'Langfuse', 'RAG', 'WSL', 'Prompt Engineering',
                            'LLM Evaluation', 'Jira', 'Figma', 'LLM Fine-tuning',
                            'Microsoft Azure', 'Azure Functions', 'Durable Functions', 'Azure Blob Storage',
                            'RESTful APIs', 'Webhooks', 'Data Engineering',
                            'Docker', 'Python', 'Azure DevOps', 'CI/CD', 'GitLab', 'pgAdmin'
                        ]

                    },
                    ro: {
                        svc: 'Dezvoltare software & consultanță',
                        spec: 'Inginer software senior și generalist, cu peste 7 ani de experiență profesională. Dezvolt aplicații fullstack, fluxuri de date, sisteme cloud și integrări AI.',
                        contact: 'Contact',
                        skills: [
                            'JavaScript', 'TypeScript', 'Vue.js', 'Nuxt.js', 'Angular', 'Vuetify',
                            'Node.js', 'PostgreSQL', 'MongoDB', 'MySQL',
                            'OpenAI API', 'Azure AI Foundry', 'Azure Document Intelligence', 'Mistral OCR',
                            'LangChain', 'LangGraph', 'Langfuse', 'RAG', 'Prompt Engineering',
                            'LLM Evaluation', 'LLM Fine-tuning',
                            'Microsoft Azure', 'Azure Functions', 'Durable Functions', 'Azure Blob Storage',
                            'API-uri REST', 'Webhooks', 'Data Engineering',
                            'Docker', 'Azure DevOps', 'CI/CD'
                        ]
                    }
                }
            }),
            created() {
                const browserLang = navigator.language || navigator.userLanguage;
                if (browserLang.startsWith('ro')) {
                    this.lang = 'ro';
                } else {
                    this.lang = 'en';
                }
            },
            methods: {
                setLang(l) { this.lang = l; },
                t(key) { return this.messages[this.lang][key]; }
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>

</html>
